<style>

/* ---- art direction v1: 박스 대신 헤어라인, 세리프는 목소리, 큰 숫자는 가늘게 ---- */

<body>
<div id="fit"><div id="stage">
  <svg id="scene" width="1600" height="900" viewBox="0 0 1600 900" style="position:absolute;inset:0"></svg>
  <div class="panel" id="bayes"><div class="lbl">마칠 준비 · 베이지안 추정</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><div class="p" id="pval">0.00</div><div class="cue" id="pcue">아직 머무는 중</div></div>
    <svg id="pchart" width="328" height="120" style="margin-top:6px"></svg></div>
  <div class="panel" id="ctx"><div class="lbl" id="cxPlace">장소</div><div class="big" id="cxClock">21:40</div>
    <div class="row"><span>오늘 운전</span><b id="cxDrive">40분</b></div><div class="row"><span>의향</span><b id="cxIntent">기도 · 개신교</b></div><div class="row"><span>단계</span><b id="cxStage">준비</b></div><div class="row" style="font-size:11.5px;color:#6F6A80" id="cxPersona"></div></div>
  <div class="panel" id="logp"><div class="lbl">차량 신호 로그</div><div id="log"></div></div>
  <div class="panel" id="screen"><div class="bar"><span>Pleos Connect</span><span id="scClock">21:40</span></div>
    <div class="body" id="scBody"><div class="t" id="scT"></div><div class="b" id="scB"></div></div><div class="btns" id="scBtns"></div><div class="glow" id="scGlow"></div></div>
  <div id="sub"></div>
  <div id="ctrl"></div>
  <div id="sig"><span class="tag">신호 넣기:</span></div>
  <div id="hint">설계값 재생 · 실차 실측 아님 · [소리 켜기]로 종과 바람 · 스페이스 재생 · ← → 단계 이동 · 타임라인 클릭으로 이동</div><div id="note"></div>
  <div class="panel" id="tl"><svg id="tlsvg" width="1524" height="182"></svg></div>
</div></div>

<script src="scenarios.js"></script>
<script>
/* ---------- data: scenarios.js(window.SCENARIOS) 가 있으면 그것, 없으면 아래 기본값 ---------- */
const FALLBACK={endingModel:{mu:Math.log(15*60),sigma:0.35,thresholds:[0.5,0.7,0.85],signals:{wake:{lr:2.2,label:'화면 깨움'},backrest:{lr:3.0,label:'등받이 당김'},lean:{lr:0.35,label:'다시 기대기(반대)'}},halfLife:90},
scenarios:[]};

/* ---------- adapter: docs/journey 사양에서 생성된 scenarios.json(v>=1) → 내부 형식 ---------- */
const STAGE_KO={drive:'주행','park-in':'주차',arrive:'도착',offer:'준비',threshold:'문턱',breath:'숨',stay:'머묾',closing:'돌아옴','return':'돌아옴',done:'출발 준비',leave:'출발 준비',after:'하차 뒤',door_open:'문 열림',door_closed:'머묾',pause_call:'통화 · 멈춤',resume:'머묾',safety_exit:'안전 복원'};
const PACK_KO={protestant:'기도 · 개신교',catholic:'기도 · 천주교',buddhist:'기도 · 불교',none:'조용히 머물기'};
const SIG_KO={SCREEN_TOUCH:'화면 깨움',SEAT_BACKREST_FORWARD:'등받이 당김',SEAT_BACKREST_BACK:'다시 기댐',SEATBELT_FASTENED:'벨트 맴(예정)',SEATBELT_UNFASTENED:'벨트 풂(예정)',HEADLAMP_ON:'전조등 켬',HVAC_MANUAL:'공조 직접 조작',WINDOW_MANUAL:'창문 직접 조작',BRAKE_PRESSED:'브레이크(예정)',TURN_SIGNAL:'방향지시등'};
function adapt(J){const M=J.endingModel||{};const LR=M.likelihoodRatios||{};const th=M.thresholds||{};
 const em={thresholds:[th.LIGHT_RISE??.5,th.SOUND_FADE??.7,th.CLOSING_WORDS??.85],signals:{},halfLife:1e9,adapted:true};
 ['SCREEN_TOUCH','SEAT_BACKREST_FORWARD','SEAT_BACKREST_BACK','SEATBELT_FASTENED'].forEach(k=>{if(LR[k])em.signals[k]={lr:LR[k],label:SIG_KO[k]}});
 const sc=J.scenarios.map(x=>{const t0=x.keyframes[0].t;const kf=x.keyframes.map(k=>{const L=k.levers||{};return {t:k.t-t0,clock:k.clock,stage:STAGE_KO[k.stage]||k.stage,
   levers:{hvacC:L.hvacC,fan:L.fan,recirc:L.recirc?1:0,seatHeat:L.seatHeat,backrest:L.backrest,ambient:L.ambient,window:L.window,lock:L.lock?1:0,mirrorFolded:L.mirrorFolded?1:0},
   screen:(()=>{const c=k.screen||{};const has=c.title||c.body||(c.buttons||[]).length;return has?{title:c.title||'',body:c.body||'',buttons:c.buttons||[],dim:false}:null})(), // 빈 화면 = 변화 없음, 앞 화면 유지
   
   sound:k.sound,log:k.signals||[],p:k.session?k.session.p:null,endingStage:k.session?k.session.endingStage:null,alert:(k.signals||[]).some(v=>/gear:(D|R)/.test(v))&&k.t>0}});
  const sig=[];kf.forEach(k=>k.log.forEach(v=>{const m=v.match(/^ending:(\w+)/);if(m)sig.push({t:k.t,type:m[1]})}));
  const c=x.context||{};return {id:x.id,name:x.title,place:c.place||'',clock:(x.keyframes[0].clock||'21:00').slice(0,5),drive:c.driveMin||0,intent:PACK_KO[c.pack]||c.pack||'',duration:kf[kf.length-1].t,kf,signals:sig,persona:x.persona,adapted:true}});
 return {endingModel:em,scenarios:sc}}

const DATA=(window.SCENARIOS&&window.SCENARIOS.scenarios)?(window.SCENARIOS.version?adapt(window.SCENARIOS):window.SCENARIOS):FALLBACK;
const EM=DATA.endingModel||FALLBACK.endingModel;
const STAGES=['준비','문턱','숨','머묾','돌아옴','출발 준비'];

/* ---------- state ---------- */
let S=DATA.scenarios[0],T=0,playing=true,speed=20,last=performance.now(),userSig=[];
const $=id=>document.getElementById(id);

/* ---------- interpolation ---------- */
function leverAt(t){const st={};let ks=S.kf.filter(k=>k.levers);
 const keys=['hvacC','fan','recirc','seatHeat','backrest','window','lock','mirrorFolded'];
 const cur={},prev={};for(const k of ks){if(k.t<=t){for(const [n,v] of Object.entries(k.levers)){prev[n]={t:k.t,v}}}}
 for(const n of [...keys,'ambient']){const p=prev[n];if(!p)continue;const dur=n==='backrest'?6:n==='window'?4:n==='ambient'?(p.v.ms||3000)/1000:n==='hvacC'?20:0;
  // find value before p
  let before=null;for(const k of ks){if(k.t<p.t&&k.levers[n]!==undefined)before=k.levers[n]}
  const a=dur?Math.min(1,(t-p.t)/dur):1,e=a<.5?2*a*a:1-Math.pow(-2*a+2,2)/2;
  if(n==='ambient'){const b=before||p.v;st.amb={pct:lerp(b.pct,p.v.pct,e),hex:mixHex(b.hex,p.v.hex,e)}}
  else if(typeof p.v==='number'&&before!=null&&['hvacC','backrest','window'].includes(n))st[n]=lerp(before,p.v,e);else st[n]=p.v}
 return st}
const lerp=(a,b,e)=>a+(b-a)*e;
function mixHex(a,b,e){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=[16,8,0].map(s=>Math.round(lerp(pa>>s&255,pb>>s&255,e)));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function frameAt(t){let f=S.kf[0];for(const k of S.kf)if(k.t<=t&&k.screen)f=k;return f}
function noteAt(t){let n=null;for(const k of S.kf)if(k.t<=t&&(k.note||k.screen))n=k;return n&&n.note?n:null}
function stageAt(t){let s=S.kf[0].stage;for(const k of S.kf)if(k.t<=t&&k.stage)s=k.stage;return s}

/* ---------- bayes: prior lognormal CDF on session length + signal likelihood ratios with decay ---------- */
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
function prior(t){if(S.adapted)return null;const mu=S.mu||EM.mu,sg=EM.sigma;if(t<=0)return 1e-4;return Math.max(1e-4,Math.min(.9999,.5*(1+erf((Math.log(t)-mu)/(sg*Math.SQRT2)))))}
function posterior(t){if(S.adapted){let a=null,b=null;for(const k of S.kf){if(k.p==null)continue;if(k.t<=t)a=k;else{b=k;break}}let p=a?(b?a.p+(b.p-a.p)*Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t||1))):a.p):0;p=Math.min(.9999,Math.max(1e-4,p));let lo2=Math.log(p/(1-p));for(const u of userSig){if(u.t<=t&&EM.signals[u.type])lo2+=Math.log(EM.signals[u.type].lr)}return 1/(1+Math.exp(-lo2))}
 let lo=Math.log(prior(t)/(1-prior(t)));const sigs=[...S.signals,...userSig];
 for(const s of sigs){if(s.t>t)continue;const spec=EM.signals[s.type];if(!spec)continue;const w=Math.pow(.5,(t-s.t)/(EM.halfLife||90));lo+=Math.log(spec.lr)*w}
 return 1/(1+Math.exp(-lo))}

/* ---------- scene ---------- */
const NS='http://www.w3.org/2000/svg',sv=$('scene');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||sv).appendChild(e);return e}
sv.innerHTML=`<defs>
<radialGradient id="lamp" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#3A3632" stop-opacity=".55"/><stop offset="1" stop-color="#0B0A0F" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14121A"/><stop offset="1" stop-color="#0B0A0F"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2638" stop-opacity=".55"/><stop offset="1" stop-color="#15131C" stop-opacity=".35"/></linearGradient>
<radialGradient id="amb" cx="50%" cy="50%" r="50%"><stop offset="0" id="ambS0" stop-color="#FFB15C" stop-opacity=".55"/><stop offset="1" id="ambS1" stop-color="#FFB15C" stop-opacity="0"/></radialGradient>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter><filter id="blur20"><feGaussianBlur stdDeviation="22"/></filter>
<clipPath id="cabin"><path d="M470 520 L520 420 Q560 362 650 352 L940 344 Q1010 344 1060 392 L1120 468 L1120 590 L470 590 Z"/></clipPath><clipPath id="frontwin"><path d="M528 418 Q562 368 650 360 L780 356 L780 470 L500 470 Z"/></clipPath>
</defs>`;
el('rect',{x:0,y:0,width:1600,height:900,fill:'url(#floor)'});
for(let i=0;i<5;i++){el('ellipse',{cx:120+i*360,cy:0,rx:220,ry:260,fill:'url(#lamp)'});el('rect',{x:116+i*360,y:0,width:8,height:6,fill:'#6A6480',opacity:.6})}

el('line',{x1:0,y1:646,x2:1600,y2:646,stroke:'rgba(255,255,255,.07)','stroke-width':1});
for(let i=0;i<9;i++)el('rect',{x:60+i*190,y:656,width:110,height:5,rx:2,fill:'#2A2633',opacity:.6});


/* car */
const car=el('g',{transform:'translate(-60,0)'});
const ambGlow=el('ellipse',{cx:800,cy:470,rx:330,ry:120,fill:'url(#amb)',filter:'url(#blur20)'},car);
const floorSpill=el('ellipse',{cx:815,cy:652,rx:420,ry:16,fill:'url(#amb)',filter:'url(#blur20)',opacity:.7},car);
el('path',{d:'M360 590 Q360 540 420 520 L520 420 Q560 362 650 352 L940 344 Q1010 344 1060 392 L1140 470 Q1240 482 1262 530 L1270 590 L1206 590 A56 56 0 0 0 1094 590 L526 590 A56 56 0 0 0 414 590 Z',fill:'#0E0D12',stroke:'rgba(255,255,255,.16)','stroke-width':1.2},car);
const cabin=el('g',{'clip-path':'url(#cabin)'},car);
el('rect',{x:470,y:340,width:660,height:270,fill:'#0B0A0E'},cabin);
const ambInside=el('ellipse',{cx:780,cy:525,rx:380,ry:190,fill:'url(#amb)',opacity:.5},cabin);
const ambStrip=el('rect',{x:560,y:520,width:470,height:4,rx:2,fill:'#FFB15C'},cabin);
const ambStripBlur=el('rect',{x:560,y:514,width:470,height:16,rx:8,fill:'#FFB15C',filter:'url(#blur8)',opacity:.8},cabin);
/* windows (glass that rises) */
const winFront=el('path',{d:'M528 418 Q562 368 650 360 L780 356 L780 470 L500 470 Z',fill:'url(#glass)',stroke:'rgba(255,255,255,.10)'},car);
const winRearMask=el('path',{d:'M800 358 L936 352 Q996 352 1034 390 L1084 462 L800 462 Z',fill:'url(#glass)',stroke:'rgba(255,255,255,.10)'},car);
const winOpen=el('rect',{x:496,y:352,width:290,height:0,fill:'#0B0A0F','clip-path':'url(#frontwin)'},car);
el('line',{x1:790,y1:352,x2:790,y2:586,stroke:'rgba(255,255,255,.10)','stroke-width':1.5},car);
/* dashboard + display + vent particles */
el('path',{d:'M470 470 L560 455 L600 480 L470 500 Z',fill:'#121117',stroke:'rgba(255,255,255,.08)'},cabin);
const dash=el('rect',{x:548,y:440,width:40,height:26,rx:4,fill:'#211D2B',stroke:'#4A4458'},cabin);
const dashGlow=el('rect',{x:550,y:442,width:36,height:22,rx:3,fill:'#FFB15C',opacity:.5},cabin);
const vents=el('g',{},cabin);const parts=[];for(let i=0;i<26;i++){parts.push({c:el('circle',{r:1.6,fill:'#EDEAF2',opacity:0},vents),x:0,y:0,life:Math.random()})}
/* seat + person */

/* ---------- sound: 종과 바람은 브라우저에서 합성(WebAudio), 음성 낭독은 예정 ---------- */
const SND_KO={bell_once:'종 한 번',leaves_wind:'바람 소리',none:'고요'};
function sndEvents(){const o=[];let last='';S.kf.forEach(k=>{if(!k.sound)return;const key=(k.sound.bgm||'')+'|'+(k.sound.tts||'');if(key===last)return;last=key;o.push({t:k.t,bgm:k.sound.bgm,tts:k.sound.tts,vol:k.sound.vol})});return o}
function curSnd(t){let c=null;for(const e of sndEvents()){if(e.t<=t)c=e;else break}return c}
let AC=null,wind=null,sndOn=false,sndLast=null;
function bell(){const t=AC.currentTime;[[528,.22,5],[1056,.07,3],[1584,.035,2]].forEach(([f,g,d])=>{const o=AC.createOscillator(),a=AC.createGain();o.frequency.value=f;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d)})}
function setWind(v){if(!wind){const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=AC.createBufferSource();n.buffer=b;n.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;wind=AC.createGain();wind.gain.value=0;n.connect(f).connect(wind).connect(AC.destination);n.start()}wind.gain.linearRampToValueAtTime(v,AC.currentTime+1.5)}
function soundTick(){if(!sndOn||!AC)return;const e=playing?curSnd(T):null;if(e===sndLast||(e&&sndLast&&e.t===sndLast.t))return;sndLast=e;if(e&&e.bgm==='bell_once')bell();setWind(e&&e.bgm==='leaves_wind'?.05*Math.pow(10,((e.vol??-18)+18)/20):0)}
