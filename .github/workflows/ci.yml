name: ci
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문서 링크 검사
        run: python3 scripts/check_links.py --strict
      - name: 공개 점검 (출판 파일 무결성 · 공개 금지 내용)
        run: python3 scripts/check_published.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 판단 규칙 테스트와 빌드
        run: ./gradlew :core:test :app:assembleDebug
